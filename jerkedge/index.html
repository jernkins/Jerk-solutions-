<!doctype html>

<head>

<title>JerkEdge — Your World. Your Edge.</title>
<style>
:root{color-scheme:dark;--purple:#a855f7;--violet:#7c3aed;--ink:#070711;--muted:#b9b3d4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 42%,#17102e 0,#080713 42%,#03040a 78%);color:#f7f3ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}
.topbar{height:64px;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid #32234c;background:#090914e8}.tab{height:44px;display:flex;align-items:center;gap:10px;padding:0 16px;border:1px solid #513078;border-radius:12px 12px 0 0;background:#141126;min-width:205px}.mini{font-weight:900;font-size:22px;color:#d6a4ff;text-shadow:0 0 15px #a855f7}.plus{font-size:25px;color:#bcb4d6}.window{margin-left:auto;letter-spacing:18px;color:#c5bbdf;font-size:18px}.nav{display:flex;align-items:center;gap:20px;padding:12px 22px;border-bottom:1px solid #211a35;color:#d3c8ee}.navicon{font-size:22px}.address{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:1px solid #45305f;border-radius:30px;padding:12px 18px;background:#0b0a17;color:#aaa0c8}.address input{background:transparent;border:0;outline:0;color:white;width:100%;font-size:15px}.main{position:relative;display:flex;align-items:center;flex-direction:column;text-align:center;padding:72px 20px 90px;min-height:calc(100vh - 120px)}.glow{position:absolute;width:550px;height:240px;top:180px;background:#6d28d933;filter:blur(90px);pointer-events:none}.logo{z-index:1;width:138px;height:138px;border:2px solid #b34aff;border-radius:35px;display:grid;place-items:center;background:linear-gradient(145deg,#19072f,#080711 58%,#35105a);box-shadow:0 0 18px #9d35ff, inset 0 0 25px #7023b8;color:#e9c8ff;font-size:94px;font-weight:900;font-style:italic;text-shadow:0 0 18px #a855f7}.brand{font-size:clamp(40px,6vw,64px);font-weight:850;letter-spacing:-2px;margin:20px 0 8px}.brand span{background:linear-gradient(90deg,#c9a2ff,#8b2df3);background-clip:text;color:transparent}.tag{letter-spacing:6px;color:#d5b8ff;font-size:14px;margin:0 0 38px}.search{z-index:1;display:flex;align-items:center;gap:14px;width:min(760px,95%);padding:10px 12px 10px 20px;border:1px solid #a13bff;border-radius:50px;background:#100b21;box-shadow:0 0 22px #7e22ce24}.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;font-size:16px;padding:10px}.search button{border:0;border-radius:50%;width:46px;height:46px;background:linear-gradient(135deg,#c026ff,#6d28d9);color:white;font-size:24px;cursor:pointer}.shortcuts{display:flex;justify-content:center;flex-wrap:wrap;gap:24px;margin-top:56px;z-index:1}.shortcut{width:70px;color:#eee7ff;text-decoration:none;font-size:13px}.tile{width:58px;height:58px;margin:0 auto 10px;border:1px solid #48306a;border-radius:17px;background:#121020;display:grid;place-items:center;font-size:24px;transition:.2s}.shortcut:hover .tile{transform:translateY(-4px);border-color:#c084fc;box-shadow:0 0 18px #9333ea55}.bottom{position:absolute;bottom:25px;left:28px;right:28px;display:flex;justify-content:space-between;color:#c8bce5;font-size:13px}.bottom span{color:#bd70ff}@media(max-width:600px){.topbar{padding:0 10px}.nav{gap:10px;padding:10px}.navicon.hide{display:none}.main{padding-top:55px}.logo{width:110px;height:110px;font-size:74px;border-radius:28px}.tag{letter-spacing:3px;font-size:11px}.shortcuts{gap:14px;margin-top:38px}.bottom{position:static;margin-top:55px;gap:16px;flex-wrap:wrap}.main{min-height:calc(100vh - 120px)}.window{letter-spacing:8px}}
</style>
</head>
<body>
<header class="topbar"><div class="tab"><span class="mini">J</span><strong>JerkEdge</strong><span style="margin-left:auto;color:#d5c9e8">×</span></div><span class="plus">+</span><div class="window">— □ ×</div></header>
<div class="nav"><span class="navicon">‹</span><span class="navicon">›</span><span class="navicon">↻</span><span class="navicon hide">⌂</span><form class="address" id="addressForm"><span style="color:#c084fc">⬡</span><input id="addressInput" aria-label="Search or enter address" placeholder="Search or enter address..."><span>☆</span></form><span class="navicon hide">♧</span><span class="navicon">☰</span></div>
<main class="main"><div class="glow"></div><div class="logo" aria-label="JerkEdge logo">J</div><h1 class="brand">Jerk<span>Edge</span></h1><p class="tag">YOUR WORLD. YOUR EDGE.</p>
<form class="search" id="searchForm"><span style="font-size:28px;color:#c4a5fd">⌕</span><input id="searchInput" aria-label="Search the web" placeholder="Search the web or enter a URL..."><button aria-label="Search" type="submit">→</button></form>
<div class="shortcuts">
<a class="shortcut" href="https://youtube.com"><div class="tile">▶</div>YouTube</a>
<a class="shortcut" href="https://google.com"><div class="tile">G</div>Google</a>

</div>
<footer class="bottom"><div><span>⬡</span> Secure Browsing &nbsp; | &nbsp; Fast &nbsp; • &nbsp; Private &nbsp; • &nbsp; Smart</div><div>⚙ Settings</div></footer></main>
<script>
function destination(value){const q=value.trim();if(!q)return null;if(/^https?:\/\//i.test(q))return q;if(/^[\w-]+\.[a-z]{2,}([/:?#].*)?$/i.test(q))return 'https://'+q;return 'https://www.google.com/search?q='+encodeURIComponent(q)}
function submitSearch(e){e.preventDefault();const field=e.currentTarget.querySelector('input');const url=destination(field.value);if(url)window.location.href=url}
document.getElementById('searchForm').addEventListener('submit',submitSearch);
document.getElementById('addressForm').addEventListener('submit',submitSearch);
</script>
</body></html>
